name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HUSKY: 0

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + tags：后续 git describe 依赖最近 tag
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          cd packages/rpc-core && bun run build
          cd ../..

      - name: Download Electron artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release 与 Build 由同一 push 触发；等待同一 commit 的 Build run
          # 完成后再下载，避免 artifacts 尚未产出的竞态。
          SHA=${{ github.sha }}
          BUILD_RUN_ID=""
          for i in $(seq 1 60); do
            BUILD_RUN_ID=$(gh run list --workflow=build.yml --commit "$SHA" --json databaseId --jq '.[0].databaseId')
            STATUS=$(gh run list --workflow=build.yml --commit "$SHA" --json status --jq '.[0].status')
            [ "$STATUS" = "completed" ] && break
            echo "Build run for $SHA still $STATUS; waiting (attempt $i/60)..."
            sleep 30
          done
          if [ "$STATUS" != "completed" ] || [ -z "$BUILD_RUN_ID" ]; then
            echo "::error::Build workflow for $SHA did not complete in time"
            exit 1
          fi
          echo "Downloading artifacts from build run $BUILD_RUN_ID"

          # 下载 desktop artifacts（linux 构建当前为 continue-on-error，失败不阻断发布）
          gh run download $BUILD_RUN_ID --name desktop-macos-agent --dir dist-artifacts || echo "::warning::desktop-macos-agent artifact missing"
          gh run download $BUILD_RUN_ID --name desktop-windows-agent --dir dist-artifacts || echo "::warning::desktop-windows-agent artifact missing"
          gh run download $BUILD_RUN_ID --name desktop-linux-agent --dir dist-artifacts || echo "::warning::desktop-linux-agent artifact missing"

      - name: Upload Electron artifacts to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最新 tag
          TAG=$(git describe --tags --abbrev=0)
          echo "Uploading artifacts for tag: $TAG"
          
          # 上传 DMG (macOS)
          gh release upload $TAG dist-artifacts/desktop-macos-*/**/*.dmg || echo "No DMG files"
          
          # 上传 NSIS (Windows)
          gh release upload $TAG dist-artifacts/desktop-windows-*/**/*.exe || echo "No EXE files"
          
          # 上传 AppImage 和 deb (Linux)
          gh release upload $TAG dist-artifacts/desktop-linux-*/**/*.AppImage || echo "No AppImage files"
          gh release upload $TAG dist-artifacts/desktop-linux-*/**/*.deb || echo "No deb files"

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
